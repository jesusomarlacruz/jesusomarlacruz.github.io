cv:
  name: Jesus Omar Lacruz
  label: Senior Researcher, Wireless Networking Group, IMDEA Networks Institute
  location: Madrid, Spain
  image: ""
  summary: >
    Senior Researcher in the Wireless Networking Group at IMDEA Networks Institute (Madrid,
    Spain). Works on high-speed signal processing architectures and FPGA/RFSoC implementations
    for sub-6 GHz and millimeter-wave MIMO systems, integrated sensing and communication
    (ISAC), and 6G. Ph.D. in Electronic Engineering (Cum Laude), Universitat
    Politècnica de València.

  social_networks:
    - network: GitHub
      username: jesusomarlacruz

  address:
    street: Avenida del Mar Mediterráneo, 22
    city: Leganés
    region: Madrid
    postalCode: "28918"
    countryCode: ES

  sections:
    Education:
      - institution: Universitat Politècnica de València
        location: Valencia, Spain
        url: https://www.upv.es/
        area: Electronic Engineering
        studyType: Ph.D., Cum Laude
        start_date: 2013-09
        end_date: 2016-10
        highlights:
          - "Thesis: Low-complexity algorithms and hardware architectures for Non-Binary LDPC decoders, achieving Giga-rate decoding with high throughput/area efficiency."

      - institution: Universitat Politècnica de València
        location: Valencia, Spain
        url: https://www.upv.es/
        area: Electronic Engineering
        studyType: M.Sc., 9.2/10
        start_date: 2011-09
        end_date: 2013-07
        highlights:
          - "FPGA implementation of DSP and digital communication blocks; system-on-chip architectures; synthesis and verification using VHDL / Verilog."

      - institution: Universidad de Los Andes
        location: Mérida, Venezuela
        url: https://www.ula.ve/
        area: Electrical Engineering
        studyType: B.Sc., 7.8/10
        start_date: 2003-03
        end_date: 2009-09
        highlights:
          - "Analog and digital electronics; communication systems; digital signal processing."

    Experience:
      - company: IMDEA Networks Institute
        position: Senior Researcher (Full-time)
        location: Madrid, Spain
        start_date: 2024-07
        end_date: present
        highlights:
          - Leading the Wireless Networks on SoCs sub-group, in charge of the design and development of high-speed signal processing architectures for millimeter-wave (mm-wave) communication systems.
          - Supervision of Ph.D. students.
          - PI / co-PI of regional, national, and European projects.

      - company: IMDEA Networks Institute
        position: Research Engineer (Full-time)
        location: Madrid, Spain
        start_date: 2017-10
        end_date: 2024-07
        highlights:
          - Leading the design and development of FPGA-based experimentation platforms for multi-Giga-sampling-rate SISO and MIMO mm-wave communication systems.
          - Signal processing blocks for 5G-NR and WLAN mm-wave systems.
          - Co-supervising Ph.D. students in the Wireless Networking Group.

      - company: Universidad de Los Andes
        position: Full-time Professor
        location: Mérida, Venezuela
        start_date: 2010-03
        end_date: 2017-10
        highlights:
          - "Full-time professor with the Electronic / Communications Department."
          - "Teaching: Analog / Digital Electronics; Foundations of Communication Systems; Basics of Digital Signal Processing (undergraduate and Master's level)."
          - Supervising Final Degree Projects.

